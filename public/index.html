<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work with us</title>
<style>
  :root { --ink:#15171c; --muted:#5e6470; --line:#e3e5e9; --acc:#0f766e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:var(--ink); background:#fafafa; }
  main { max-width: 560px; margin: 48px auto; padding: 32px; background:#fff; border:1px solid var(--line); border-radius:16px; }
  h1 { margin:0 0 8px; font-size: 28px; } p.sub { margin:0 0 24px; color:var(--muted); }
  label { display:block; font-size:14px; font-weight:600; margin:14px 0 6px; }
  input, select, textarea { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font:inherit; }
  textarea { min-height:110px; resize:vertical; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .hp { position:absolute; left:-9999px; }
  button { margin-top:22px; width:100%; padding:14px; border:0; border-radius:999px; background:var(--acc); color:#fff; font-weight:700; font-size:16px; cursor:pointer; }
  button:disabled { opacity:.6; } #msg { margin-top:16px; font-weight:600; }
  @media (max-width:560px){ main{ margin:0; border-radius:0; } .row{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <h1>Tell us about your project</h1>
  <p class="sub">You'll get a reply within minutes.</p>
  <form id="f">
    <div class="row">
      <div><label for="name">Name *</label><input id="name" name="name" required></div>
      <div><label for="email">Work email *</label><input id="email" name="email" type="email" required></div>
    </div>
    <div class="row">
      <div><label for="company">Company</label><input id="company" name="company"></div>
      <div><label for="role">Role</label><input id="role" name="role"></div>
    </div>
    <label for="website">Website</label><input id="website" name="website">
    <div class="row">
      <div><label for="company_size">Company size</label>
        <select id="company_size" name="company_size"><option value="unknown">Select</option><option>1-10</option><option>11-50</option><option>51-200</option><option>201-1000</option><option>1000+</option></select></div>
      <div><label for="budget">Budget</label>
        <select id="budget" name="budget"><option value="unknown">Select</option><option value="<1.5k">Under $1.5k</option><option value="1.5k-5k">$1.5k–5k</option><option value="5k-15k">$5k–15k</option><option value="15k+">$15k+</option></select></div>
    </div>
    <label for="timeline">Timeline</label>
    <select id="timeline" name="timeline"><option value="unknown">Select</option><option value="now">Ready now</option><option value="1-3 months">1–3 months</option><option value="3-6 months">3–6 months</option><option value="exploring">Just exploring</option></select>
    <label for="message">What would you like to automate or improve? *</label>
    <textarea id="message" name="message" required></textarea>
    <input class="hp" name="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button id="btn" type="submit">Send</button>
    <div id="msg" role="status"></div>
  </form>
</main>
<script>
  const API_BASE = ""; // same origin. If the form lives on another site, put the API URL here.
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("btn"), msg = document.getElementById("msg");
    btn.disabled = true; msg.textContent = "Sending…";
    const data = Object.fromEntries(new FormData(e.target).entries());
    try {
      const r = await fetch(API_BASE + "/leads", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
      if (!r.ok) throw new Error(await r.text());
      e.target.reset(); msg.textContent = "Thanks! Check your inbox in a few minutes.";
    } catch (err) {
      msg.textContent = "Something went wrong. Please check your email address and try again.";
    } finally { btn.disabled = false; }
  });
</script>
</body>
</html>
