# Calls /cron/retry every 10 minutes so failed steps are retried (a free alternative to Vercel Cron).
# Setup: add repo secrets APP_URL (e.g. https://your-app.vercel.app) and CRON_SECRET.
# Without APP_URL the job exits cleanly, so forks and template copies don't fail every 10 minutes.
# GitHub runs schedules best-effort; for client work, use a dedicated scheduler (see README).
name: retry-pending-leads
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Retry pending leads
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL secret not set; skipping."; exit 0; fi
          curl --fail -sS -X POST "$APP_URL/cron/retry" -H "Authorization: Bearer $CRON_SECRET"
